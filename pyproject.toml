[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lldb_mcp"
version = "0.1.0"
description = "LLDB MCP Server for AI-assisted debugging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ant4g0nist"}
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "fastmcp>=0.4.1",
]

[project.scripts]
lldb-mcp = "lldb_mcp_server:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
